name: Kotlin

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

env:
  JAVA_VERSION: '17'
  JAVA_DISTRIBUTION: 'liberica'

jobs:
  version_checker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: JAVA_VERSION
          distribution: JAVA_DISTRIBUTION

      - name: Run VersionChecker
        run: ./gradlew versionChecker

  duplicate_links_checker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: JAVA_VERSION
          distribution: JAVA_DISTRIBUTION

      - name: Run DuplicateLinksChecker
        run: ./gradlew duplicateLinksChecker

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: JAVA_VERSION
          distribution: JAVA_DISTRIBUTION

      - name: Run tests with Gradle
        run: ./gradlew test
